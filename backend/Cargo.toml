[workspace]
members = [
    ".",
    "crates/stagelinq",
    "crates/prodjlink",
    "crates/fixture-kinematics",
    "crates/luma-fixture",
    "crates/patterns",
    "crates/sync",
]

[package]
name = "luma"
version = "0.7.0"
description = "Node-based lighting control software for live performance"
authors = ["Julian Allchin <julian@allchin.com>"]
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/lumashow/luma"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma_lib"
crate-type = ["rlib"]

[[bin]]
name = "luma-cli"
path = "src/bin/luma-cli/main.rs"

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1.0"
tar = "0.4"

[features]
# A model provider that reads from a script instead of a network. The GPUI
# harness turns this on; the shipped app must not be able to hold one.
scripted-model = []

[dependencies]
luma-patterns = { path = "crates/patterns" }
# PowerSync SDK glue: the SQLx pool and the SDK pool over one SQLite file.
luma-sync = { path = "crates/sync" }
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` because the app gets it anyway (zed's gpui turns it on), and
# a headless build without it orders every JSON object differently: the IPC
# manifest test then rewrites the whole file.
serde_json = { version = "1", features = ["preserve_order"] }
# OSC, to hear rkbx_link (MIT OR Apache-2.0).
rosc = "0.11.4"
thiserror = "2"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
base64 = "0.21"
lofty = "0.22.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
realfft = "3.5"
rayon = "1.10"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac", "ogg", "vorbis"] }
cpal = "0.15"
tokio = { version = "1", features = ["macros", "sync", "time", "rt", "signal", "process", "io-util", "net"] }
async-trait = "0.1"
futures-util = "0.3"
# USB DMX dongles (`src/output/usb.rs`). Pure Rust, so no libusb to install.
nusb = "0.2.8"
schemars = "1.2"
once_cell = "1"
libc = "0.2"
quick-xml = { version = "0.38.4", features = ["serialize"] }
rand = "0.8"
walkdir = "2.5.0"
stagelinq = { path = "crates/stagelinq" }
# Rekordbox's encrypted master database (`src/rekordbox`).
rbox = "0.1.7"
prodjlink = { path = "crates/prodjlink" }
# The offscreen renderer, so `luma.venue.render(...)` in an agent's Python
# workspace produces a PNG of the stage from the same renderer the desktop
# viewport uses. Only the rendering modules (`stage_render`, `recording`) and
# the CLI's render commands use it: it links wgpu, and everything else reaches
# venue types through `luma-scene`. It reaches across into the `gpui/`
# workspace; that direction is safe because `luma-render` and `luma-scene`
# depend on nothing here but `fixture-kinematics` and `luma-fixture`.
luma-render = { path = "../gpui/crates/render" }
# Where a fixture's light comes from and where it points — the single
# implementation the renderer, the eval engine and the agent bindings share.
fixture-kinematics = { path = "crates/fixture-kinematics" }
# The fixture library's specs: what a `lib:` fixture is built and driven from.
luma-fixture = { path = "crates/luma-fixture" }
# The vector type those two speak. Pinned to their version by definition: a
# second glam here would be a second, incompatible `Vec3`.
glam = "0.30"
# The venue model without a GPU: the venue graph and its resolver, the stage
# catalog and its sockets, the stored environment, haze and fixture records.
luma-scene = { path = "../gpui/crates/scene" }
chrono = "0.4"
dirs = "5"
tempfile = "3"
log = "0.4"
midir = "0.9"

[dev-dependencies]
# `src/sync/two_device_tests.rs` acts on the test stack's Postgres as an admin
# would, which no client path can.
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite", "postgres"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The MIDI thread runs its run loop: CoreMIDI reports ports plugged in there
# (`src/inputs/midi.rs`). Already in the tree through midir's coremidi.
core-foundation-sys = "0.8"

# Fast compile, no optimizations.
# Line tables, not full DWARF: backtraces keep `file:line`, and the test
# binaries and headless hosts this workspace builds link far faster. The app is
# built from gpui/, which already builds this crate this way. For a debugger
# session, build with `CARGO_PROFILE_DEV_DEBUG=true`.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

# Dependencies are optimized and carry no debuginfo, as in gpui/: the
# renderer, the PNG encoder and the audio decoders are far too slow at
# opt-level 0, and the tests that render, encode or decode spent most of their
# time there. `"*"` never matches workspace members, so they stay fast to
# rebuild.
[profile.dev.package."*"]
opt-level = 2
debug = false
