[package]
name = "luma-sync"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["runtime-tokio", "sqlite"] }
powersync = { git = "https://github.com/julianallchin/powersync-native", rev = "f8a33f27bc4c86105adf39da74490a1133932783", default-features = false, features = ["tokio", "reqwest"] }
powersync-http = { package = "reqwest", version = "0.13", features = ["json"] }
libsqlite3-sys = "=0.33.0"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
