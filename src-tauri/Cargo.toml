[workspace]
members = [
    ".",
    "crates/stagelinq",
    "crates/rekordbox",
    "crates/prodjlink",
    "crates/fixture-kinematics",
]

[package]
name = "luma"
version = "0.5.19"
description = "Node-based lighting control software for live performance"
authors = ["Julian Allchin <julian@allchin.com>"]
license = "PolyForm-Shield-1.0.0"
repository = "https://github.com/julianallchin/luma"
edition = "2021"
default-run = "luma"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench_waveform"
path = "src/bin/bench_waveform.rs"

[[bin]]
name = "dump_venue"
path = "src/bin/dump_venue.rs"

[[bin]]
name = "bench_eval"
path = "src/bin/bench_eval.rs"

[[bin]]
name = "run_goldens"
path = "src/bin/run_goldens.rs"

[[bin]]
name = "dump_node_types"
path = "src/bin/dump_node_types.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1.0"
tar = "0.4"

[features]
# A model provider that reads from a script instead of a network. The GPUI
# harness turns this on; the shipped app must not be able to hold one.
scripted-model = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
petgraph = "0.6"
base64 = "0.21"
lofty = "0.22.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
realfft = "3.5"
rayon = "1.10"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac", "ogg", "vorbis"] }
cpal = "0.15"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
async-trait = "0.1"
futures-util = "0.3"
schemars = "1.2"
once_cell = "1"
libc = "0.2"
quick-xml = { version = "0.38.4", features = ["serialize"] }
rand = "0.8"
walkdir = "2.5.0"
stagelinq = { path = "crates/stagelinq" }
rekordbox = { path = "crates/rekordbox" }
prodjlink = { path = "crates/prodjlink" }
chrono = "0.4"
dirs = "5"
tempfile = "3"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-macos-fps = "0.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
midir = "0.9"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls"] }

# Fast compile, no optimizations (use `cargo run --profile perf` for optimized builds)
[profile.dev]
opt-level = 0

# Dependencies carry no debuginfo. `"*"` never matches workspace members, so
# everything under `src/` keeps full DWARF and stays steppable in a debugger —
# this only gives up line numbers inside third-party frames, which is the half
# of the tree nobody sets a breakpoint in and most of the bytes on disk.
#
# The gpui workspace goes further and drops its own crates to line tables too;
# it is a test harness, where a backtrace is the whole debugging story. This is
# the app someone actually steps through, so it keeps them.
[profile.dev.package."*"]
debug = false

# Optimized dev builds for real-time audio/DSP testing
[profile.perf]
inherits = "dev"
opt-level = 2
