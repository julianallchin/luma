name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to a pull request supersedes the run still going on it. Branch
# pushes get a group of their own, so every commit on main and dev keeps its
# full run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The Rust jobs share the repository's 10 GB Actions cache with the release
# workflow. A run restores entries saved on its own branch or on main, so an
# entry saved on a pull request is one no other run can use. Past the limit,
# GitHub evicts the least recently used entries, and main's CI and the nightly
# then build from scratch. So only branch pushes save. A failed run saves too,
# so the next run starts warm after a lockfile change; cargo's fingerprints
# decide what is reused either way.

jobs:
  # `cargo check` builds metadata and `cargo test` builds code, so the two
  # share no artifacts. As separate jobs their builds run side by side.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Check native app
        run: cargo check --workspace --all-targets
        working-directory: gpui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Test scene model
        run: cargo test -p luma-scene
        working-directory: gpui
      - name: Test composable pattern engine
        run: cargo test -p luma-patterns
        working-directory: gpui
      - name: Test updater
        run: cargo test -p luma-update
        working-directory: gpui
      - name: Test headless app flows
        run: cargo test -p gpui-agent --test headless
        working-directory: gpui

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Test backend
        run: cargo test --workspace --no-fail-fast
        working-directory: backend

  # The release applies every pending Supabase migration, and refuses one that
  # breaks the expand/contract rule; this catches it while it is a pull
  # request. See deploy/README.md.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added and changed migrations
        run: |
          git diff --name-only --diff-filter=AMR "origin/$GITHUB_BASE_REF...HEAD" -- 'supabase/migrations/*.sql' > changed.txt
          cat changed.txt
          xargs --no-run-if-empty python3 scripts/release/check_migrations.py < changed.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the agent executor's libraries
        run: pip install numpy scipy librosa matplotlib
      - name: Test the agent executor
        run: python backend/python/luma_exec/tests/run_tests.py
      - name: Test the analysis workers
        run: python -m unittest discover -s backend/python/tests
