name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gpui -> target
            backend -> target
      - name: Check native app
        run: cargo check --workspace --all-targets
        working-directory: gpui
      - name: Test scene model
        run: cargo test -p luma-scene
        working-directory: gpui
      - name: Test composable pattern engine
        run: cargo test -p luma-patterns
        working-directory: gpui
      - name: Test native pattern workflow
        run: cargo test -p gpui-agent --test headless lighting_patterns
        working-directory: gpui
