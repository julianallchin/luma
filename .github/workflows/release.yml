name: Release

# A `v*` tag builds a stable release as a *draft*: nothing reaches users until
# a maintainer publishes it, because publishing is what moves
# `releases/latest/download/latest.json` — the URL every install polls.
#
# Every green CI run on `main` builds that commit into the rolling `nightly`
# prerelease, which only nightly builds poll; so does a manual run, from the
# commit it is run on.
#
# See RELEASING.md for the secrets and the steps around a release.
on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A newer nightly supersedes one still building; a stable tag never waits.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'nightly' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  # The commit to build: the one CI passed, not the default branch's tip.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - id: meta
        name: Resolve channel and version
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$crate_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match backend/Cargo.toml version $crate_version"
              exit 1
            fi
            {
              echo "channel=stable"
              echo "version=$crate_version"
              echo "tag=$GITHUB_REF_NAME"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=nightly"
              echo "version=$crate_version-nightly.$(date -u +%Y%m%d)+${SHA::7}"
              echo "tag=nightly"
            } >> "$GITHUB_OUTPUT"
          fi

  # The server side of the release, before any of it is built: the pending
  # Supabase migrations, then the PowerSync sync rules if they changed. A
  # failure here ships nothing, so no install meets a server older than the
  # one it was built for. A run from main or a tag changes production; a
  # manual run from another branch only checks that production already
  # matches. See deploy/README.md.
  migrate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A stable tag and a nightly may run at once; they never push together.
    concurrency:
      group: production-schema
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_TOKEN }}
      APPLY: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: List pending migrations
        run: |
          if [[ -z "$SUPABASE_DB_URL" || -z "$PS_ADMIN_TOKEN" ]]; then
            echo "::error::SUPABASE_DB_URL and POWERSYNC_TOKEN must be set; see RELEASING.md"
            exit 1
          fi
          if [[ "$SUPABASE_DB_URL" != *smuuycypmsutwrkpctws* ]]; then
            echo "::error::SUPABASE_DB_URL does not name the production project smuuycypmsutwrkpctws"
            exit 1
          fi
          # --include-all: a file merged from a branch can be older than the
          # newest one already applied, and it is pending all the same.
          if ! supabase db push --dry-run --include-all --output-format json --db-url "$SUPABASE_DB_URL" > pending.json; then
            jq . pending.json || cat pending.json
            exit 1
          fi
          jq -r '.migrations[] | "supabase/migrations/" + .' pending.json > pending.txt
          echo "Pending: $(wc -l < pending.txt)"
          cat pending.txt
      - name: Check the contract rule
        run: xargs --no-run-if-empty python3 scripts/release/check_migrations.py < pending.txt
      - name: Apply migrations
        run: |
          if [[ ! -s pending.txt ]]; then
            echo "Production has every migration."
          elif [[ $APPLY != true ]]; then
            echo "::error::Production lacks the migrations above. Only a run from main or a tag applies them."
            exit 1
          else
            supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy sync rules
        run: |
          npm install --global powersync@0.10.3
          powersync fetch config --directory=deploy/powersync --output=json > deployed.json
          jq -j '.syncRules // ""' deployed.json > deployed-sync-config.yaml
          if cmp -s deployed-sync-config.yaml deploy/powersync/sync-config.yaml; then
            echo "The deployed sync rules match deploy/powersync/sync-config.yaml."
            exit 0
          fi
          diff -u deployed-sync-config.yaml deploy/powersync/sync-config.yaml || true
          if [[ $APPLY != true ]]; then
            echo "::error::The deployed sync rules differ. Only a run from main or a tag deploys them."
            exit 1
          fi
          powersync deploy sync-config --directory=deploy/powersync

  bundle-mac:
    needs: [prepare, migrate]
    # Apple silicon only: PyTorch publishes no macOS x86_64 wheels past 2.2,
    # so the managed Python environment could not be built on an Intel Mac.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LUMA_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      LUMA_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          submodules: recursive
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # Only main saves (a nightly runs on main): a tag or a dispatch from
      # another branch restores main's entry, and an entry of its own would
      # crowd main's out of the 10 GB cache. See ci.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dmgbuild
        run: pipx install dmgbuild==1.6.7
      - name: Bundle, sign and notarize
        env:
          MACOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: "${{ vars.APPLE_SIGNING_IDENTITY || 'Developer ID Application: PROGRAMIS PRIME LLC (75M525RTAZ)' }}"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/bundle-mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            dist/Luma-aarch64.dmg
            dist/Luma-aarch64.app.tar.gz
          if-no-files-found: error

  bundle-linux:
    needs: [prepare, migrate]
    # The oldest supported runner, for the oldest glibc the binary needs.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      LUMA_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      LUMA_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          submodules: recursive
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev
      # Saved on main only, like bundle-mac's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui -> target
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Bundle
        run: scripts/release/bundle-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/luma-linux-x86_64.tar.gz
          if-no-files-found: error

  # The only job that sees the update-signing key, and the only one that can
  # write to the repository.
  publish:
    needs: [prepare, bundle-mac, bundle-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # The whole history and its tags: the changelog reads the commits since
      # the previous release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sign update archives
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; installs would refuse an unsigned update"
            exit 1
          fi
          for archive in dist/Luma-aarch64.app.tar.gz dist/luma-linux-x86_64.tar.gz; do
            npx --yes @tauri-apps/cli@2.12.4 signer sign "$archive"
          done
      - name: Collect the changelog
        run: |
          # The channel's manifest as installs see it now. Its commit starts
          # a nightly's range, and its `changes` carry forward into this
          # release's manifest. There is none the first time.
          if [[ $CHANNEL == nightly ]]; then
            previous_url="https://github.com/$GITHUB_REPOSITORY/releases/download/nightly/latest.json"
          else
            previous_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          fi
          curl -fsSL "$previous_url" -o dist/previous.json || rm -f dist/previous.json
          if [[ $CHANNEL == stable ]]; then
            python3 scripts/release/changelog.py --commit "$SHA" --tag "$TAG" > dist/changelog.txt
          else
            python3 scripts/release/changelog.py --commit "$SHA" --previous dist/previous.json > dist/changelog.txt
          fi
          sed 's/^/- /' dist/changelog.txt > dist/changelog.md
          cat dist/changelog.md
      - name: Write latest.json
        run: |
          # Nightly installs built before platforms were keyed by target
          # triple look up these keys. Delete once every nightly install has
          # updated past that change.
          old_keys=()
          if [[ $CHANNEL == nightly ]]; then
            old_keys=(darwin-aarch64=dist/Luma-aarch64.app.tar.gz linux-x86_64=dist/luma-linux-x86_64.tar.gz)
          fi
          python3 scripts/release/manifest.py \
            --version "$VERSION" \
            --commit "$SHA" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --changes dist/changelog.txt \
            --previous dist/previous.json \
            aarch64-apple-darwin=dist/Luma-aarch64.app.tar.gz \
            x86_64-unknown-linux-gnu=dist/luma-linux-x86_64.tar.gz \
            "${old_keys[@]}" \
            > dist/latest.json
          cat dist/latest.json
          cp scripts/release/install.sh dist/install.sh
      - name: Create draft release
        if: env.CHANNEL == 'stable'
        run: |
          # The changelog, then GitHub's generated list of pull requests.
          gh release create "$TAG" --draft --verify-tag --generate-notes \
            --title "Luma $VERSION" --notes-file dist/changelog.md \
            dist/Luma-aarch64.dmg dist/Luma-aarch64.app.tar.gz dist/Luma-aarch64.app.tar.gz.sig \
            dist/luma-linux-x86_64.tar.gz dist/luma-linux-x86_64.tar.gz.sig \
            dist/latest.json dist/install.sh
      - name: Replace the nightly prerelease
        if: env.CHANNEL == 'nightly'
        run: |
          {
            echo "Built from $SHA. Nightly builds update to each newer nightly."
            if [[ -s dist/changelog.md ]]; then
              echo
              cat dist/changelog.md
            fi
          } > dist/nightly-notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --prerelease --latest=false --target "$SHA" \
            --title "Nightly $VERSION" --notes-file dist/nightly-notes.md \
            dist/Luma-aarch64.dmg dist/Luma-aarch64.app.tar.gz dist/Luma-aarch64.app.tar.gz.sig \
            dist/luma-linux-x86_64.tar.gz dist/luma-linux-x86_64.tar.gz.sig \
            dist/latest.json dist/install.sh
