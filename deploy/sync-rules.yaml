# PowerSync sync rules for the Luma row model.
#
# Three streams, matching the three shapes of row-level security in
# supabase/migrations/20260912000000_row_model.sql:
#
#   owned    everything private to one user, plus the tracks and analysis
#            behind any score that user can read
#   venue    every venue the user owns or is a member of, and its content
#   library  the verified pattern library, global to every signed-in client
#
# Edition 3 (sync streams) rather than the legacy `bucket_definitions`: legacy
# parameter and data queries support neither JOINs nor subqueries, and the
# venue content is three levels deep (venue -> node -> edge/param/constraint,
# venue -> score -> clip/definition, venue -> group -> member). Expressing that
# with bucket parameters would mean either denormalising a venue_id onto every
# child table or one bucket per node and per score, which blows past the
# per-user bucket limit on any real venue.
#
# Two rules the service enforces and the error messages do not spell out:
#   - a named `with:` clause may be referenced from `queries:`, never from
#     another `with:` clause, so each clause below stands on its own;
#   - subqueries nest one level. "Everything in an accessible venue" is
#     therefore written as two OR'd subqueries, one for owned venues and one
#     for membership, rather than one nested pair.
#
# `SELECT *` is safe because every synced table has a real `id text primary
# key`; the migration is the source of truth for the columns.

config:
  edition: 3

streams:
  owned:
    auto_subscribe: true
    with:
      # A user's own scores, plus every score in a venue they can reach.
      accessible_scores: >-
        SELECT id FROM scores
        WHERE uid = auth.user_id()
           OR venue_id IN (SELECT id FROM venues WHERE uid = auth.user_id())
           OR venue_id IN (SELECT venue_id FROM venue_members WHERE uid = auth.user_id())
      # Tracks someone else owns that a shared score plays, so a venue member
      # gets the beat grid behind the score they are looking at.
      shared_tracks: >-
        SELECT track_id AS id FROM scores
        WHERE venue_id IN (SELECT id FROM venues WHERE uid = auth.user_id())
           OR venue_id IN (SELECT venue_id FROM venue_members WHERE uid = auth.user_id())
    queries:
      - SELECT * FROM tracks WHERE uid = auth.user_id()
      - SELECT * FROM tracks WHERE id IN shared_tracks
      - SELECT * FROM track_beats WHERE uid = auth.user_id()
      - SELECT * FROM track_beats WHERE track_id IN shared_tracks
      - SELECT * FROM track_roots WHERE uid = auth.user_id()
      - SELECT * FROM track_roots WHERE track_id IN shared_tracks
      - SELECT * FROM track_stems WHERE uid = auth.user_id()
      - SELECT * FROM track_stems WHERE track_id IN shared_tracks
      - SELECT * FROM track_drum_onsets WHERE uid = auth.user_id()
      - SELECT * FROM track_drum_onsets WHERE track_id IN shared_tracks
      - SELECT * FROM track_bar_classifications WHERE uid = auth.user_id()
      - SELECT * FROM track_bar_classifications WHERE track_id IN shared_tracks
      - SELECT * FROM track_genres WHERE uid = auth.user_id()
      - SELECT * FROM track_genres WHERE track_id IN shared_tracks
      - SELECT * FROM track_beat_validations WHERE uid = auth.user_id()
      - SELECT * FROM track_beat_validations WHERE track_id IN shared_tracks
      - SELECT * FROM patterns WHERE uid = auth.user_id()
      - SELECT * FROM implementations WHERE uid = auth.user_id()
      - SELECT * FROM agent_threads WHERE uid = auth.user_id()
      - SELECT * FROM agent_thread_messages WHERE uid = auth.user_id()
      - SELECT * FROM agent_thread_transcript_heads WHERE uid = auth.user_id()
      - SELECT * FROM drafts WHERE uid = auth.user_id()
      - SELECT * FROM changes WHERE uid = auth.user_id()
      # A score with no venue is private authoring; it still needs its rows.
      - SELECT * FROM scores WHERE id IN accessible_scores
      - SELECT * FROM clips WHERE score_id IN accessible_scores
      - SELECT * FROM score_definitions WHERE score_id IN accessible_scores

  venue:
    auto_subscribe: true
    with:
      accessible_venues: >-
        SELECT id FROM venues
        WHERE uid = auth.user_id()
           OR id IN (SELECT venue_id FROM venue_members WHERE uid = auth.user_id())
      accessible_nodes: >-
        SELECT id FROM venue_nodes
        WHERE venue_id IN (SELECT id FROM venues WHERE uid = auth.user_id())
           OR venue_id IN (SELECT venue_id FROM venue_members WHERE uid = auth.user_id())
      accessible_groups: >-
        SELECT id FROM fixture_groups
        WHERE venue_id IN (SELECT id FROM venues WHERE uid = auth.user_id())
           OR venue_id IN (SELECT venue_id FROM venue_members WHERE uid = auth.user_id())
    queries:
      - SELECT * FROM venues WHERE id IN accessible_venues
      - SELECT * FROM venue_members WHERE venue_id IN accessible_venues
      - SELECT * FROM fixtures WHERE venue_id IN accessible_venues
      - SELECT * FROM fixture_groups WHERE venue_id IN accessible_venues
      - SELECT * FROM fixture_group_members WHERE group_id IN accessible_groups
      - SELECT * FROM venue_nodes WHERE venue_id IN accessible_venues
      - SELECT * FROM venue_edges WHERE child_id IN accessible_nodes
      - SELECT * FROM venue_node_params WHERE node_id IN accessible_nodes
      - SELECT * FROM venue_constraints WHERE node_id IN accessible_nodes
      - SELECT * FROM cues WHERE venue_id IN accessible_venues
      - SELECT * FROM midi_modifiers WHERE venue_id IN accessible_venues
      - SELECT * FROM midi_bindings WHERE venue_id IN accessible_venues

  library:
    auto_subscribe: true
    with:
      verified_patterns: SELECT id FROM patterns WHERE is_verified = true
    queries:
      - SELECT * FROM patterns WHERE id IN verified_patterns
      - SELECT * FROM implementations WHERE pattern_id IN verified_patterns
