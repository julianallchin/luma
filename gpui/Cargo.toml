[workspace]
resolver = "2"
members = ["crates/ui", "crates/md", "crates/chat", "crates/app", "crates/harness", "crates/agent", "crates/scene", "crates/render"]
# `crates/agent` is a member but not a *default* member. It turns on
# `luma-ui/agent` and `gpui/test-support`, and cargo unifies features across
# whatever it is building — so a bare `cargo build` that included it would ship
# the real app with a node registry it never reads and leak detection it never
# wants. Build the harness explicitly: `cargo build -p gpui-agent`.
default-members = ["crates/ui", "crates/md", "crates/chat", "crates/app", "crates/harness", "crates/scene", "crates/render"]

# Deliberately outside the src-tauri workspace — gpui's dependency tree is huge
# and must not pollute the app build. `luma-app` depends on the Luma lib by
# path, which is the one direction that link goes: the GPUI side consumes the
# command seam, the Tauri side knows nothing about GPUI.
[workspace.dependencies]
# These must stay *branch* specs, not rev pins. `gpui-component` depends on
# zed's `gpui` unpinned, and cargo unifies two git dependencies only when their
# source specs match exactly — pinning a rev here forks gpui into two crates
# and every `Icon` stops being an `IntoElement`. So the pin lives in
# `Cargo.lock` (rev 32a0e81 today), which is checked in for exactly this
# reason: a `cargo update` here moves the renderer under three crates at once.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ddba2ef356d637392c08ef773fe1bbf3dd536deb" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ddba2ef356d637392c08ef773fe1bbf3dd536deb" }
luma-ui = { path = "crates/ui" }

# Repository-contained snapshot of Zed 32a0e813 plus Comet's a6c1ad5
# BackdropBlur, 9b672fa bounded scratch work, and Luma's isolated
# content-filter layer. The snapshot is normalized with `cargo vendor` so its
# internal crates remain a closed, reproducible path dependency graph.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "vendor/zed/crates/gpui", version = "=0.2.2" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros", version = "=0.1.0" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", version = "=0.1.0" }

# Line tables, not full DWARF. Backtraces through Luma's own crates keep
# `file:line`, which is all a test failure needs; what goes is the type and
# variable detail a stepping debugger would use. Measured at 60% off `deps/`
# with `opt-level` held constant — see docs/build-overhaul.md.
[profile.dev]
debug = "line-tables-only"

# gpui is unusably slow at opt-level 0 (comet and gpui-component both do this).
#
# `"*"` is dependencies only, never workspace members, so dropping their
# debuginfo entirely costs nothing a Luma backtrace shows: symbol names live in
# the symbol table, not in DWARF, so a frame inside gpui still names itself. It
# just cannot tell you which line of gpui it was.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The per-frame CPU path, which `"*"` above cannot reach because these are
# workspace members. Frame assembly walks every fixture, cluster binning walks
# every cone, and the pick snapshot rebuilds a BVH — all of it float math in
# tight loops, which is the one shape `opt-level = 0` costs an order of
# magnitude on. Measured on the 480-fixture stage with a track playing: 19.1 ms
# of UI-thread frame assembly at 0, 1.0 ms at 2 — the whole UI half of the frame
# goes 21.6 ms to 3.1 ms. A dev build is what anybody actually running the app
# has, so leaving these at 0 means the renderer everyone sees is not the
# renderer `profile-volumetrics --release` measures, which is why that profiler
# kept reporting budgets the app could not hold.
#
# Deliberately not `luma-app`: it is the crate under active edit, its own
# per-frame work is thin, and it is the one where a stepping debugger earns its
# keep.
[profile.dev.package.luma-render]
opt-level = 2

[profile.dev.package.luma-scene]
opt-level = 2
