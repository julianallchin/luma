[workspace]
resolver = "2"
members = ["crates/ui", "crates/md", "crates/chat", "crates/app", "crates/agent", "crates/scene", "crates/render", "crates/update"]
# `crates/agent` is a member but not a *default* member. It turns on
# `luma-ui/agent` and `gpui/test-support`, and cargo unifies features across
# whatever it is building — so a bare `cargo build` that included it would ship
# the real app with a node registry it never reads and leak detection it never
# wants. Build the harness explicitly: `cargo build -p gpui-agent`.
default-members = ["crates/ui", "crates/md", "crates/chat", "crates/app", "crates/scene", "crates/render", "crates/update"]

# The backend and native UI keep separate workspaces and build profiles.
# Shared crates use path dependencies across this boundary.
[workspace.dependencies]
# These must stay unpinned specs of zed's repository, exactly as
# `gpui-component` names it: cargo unifies two git dependencies only when their
# source specs match, and two gpuis would make every `Icon` stop being an
# `IntoElement`. The `[patch]` below then swaps in Luma's gpui for both.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ddba2ef356d637392c08ef773fe1bbf3dd536deb" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ddba2ef356d637392c08ef773fe1bbf3dd536deb" }
luma-ui = { path = "crates/ui" }

# Luma's gpui: https://github.com/lumashow/gpui, branch `luma`. It is Zed's
# history filtered to gpui and the crates it builds from (branch `upstream`,
# Zed 32a0e813 today), plus Luma's changes as commits; its LUMA.md lists them.
# To change gpui, commit to `luma` there and bump this rev. To move to a newer
# Zed, filter it, rebase `luma` onto it as LUMA.md says, and bump this rev.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/lumashow/gpui", rev = "0d8b0925ed9080ec064c067b4727bce2e04aba43" }
gpui_macros = { git = "https://github.com/lumashow/gpui", rev = "0d8b0925ed9080ec064c067b4727bce2e04aba43" }
gpui_platform = { git = "https://github.com/lumashow/gpui", rev = "0d8b0925ed9080ec064c067b4727bce2e04aba43" }

# wgpu 30.0.1 plus two fixes, both for another thread submitting during
# `configure_surface`. The stage thread submits on gpui's device.
# 1. The configure fails and drops the collected callbacks, so stage frames
#    were lost. Trunk fixes it in gfx-rs/wgpu#10296.
# 2. Swapchain teardown calls `vkDeviceWaitIdle` with no queue lock, so the
#    device is lost or the configure hangs. Not fixed upstream yet.
# Remove this block when a wgpu release includes both.
[patch.crates-io]
naga = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-core = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-core-deps-apple = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-core-deps-emscripten = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-core-deps-wasm = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-hal = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-naga-bridge = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }
wgpu-types = { git = "https://github.com/julianallchin/wgpu", rev = "72512942ad43570d5ee36f49921dbb260de124b1" }

# Line tables, not full DWARF. Backtraces through Luma's own crates keep
# `file:line`, which is all a test failure needs; what goes is the type and
# variable detail a stepping debugger would use. Measured at 60% off `deps/`
# with `opt-level` held constant — see gpui/BUILD.md.
[profile.dev]
debug = "line-tables-only"

# gpui is unusably slow at opt-level 0 (comet and gpui-component both do this).
#
# `"*"` is dependencies only, never workspace members, so dropping their
# debuginfo entirely costs nothing a Luma backtrace shows: symbol names live in
# the symbol table, not in DWARF, so a frame inside gpui still names itself. It
# just cannot tell you which line of gpui it was.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The per-frame CPU path, which `"*"` above cannot reach because these are
# workspace members. Frame assembly walks every fixture, cluster binning walks
# every cone, and the pick snapshot rebuilds a BVH — all of it float math in
# tight loops, which is the one shape `opt-level = 0` costs an order of
# magnitude on. Measured on the 480-fixture stage with a track playing: 19.1 ms
# of UI-thread frame assembly at 0, 1.0 ms at 2 — the whole UI half of the frame
# goes 21.6 ms to 3.1 ms. A dev build is what anybody actually running the app
# has, so leaving these at 0 means the renderer everyone sees is not the
# renderer a release-build profile measures, and a profile reports budgets the
# app cannot hold.
#
# Deliberately not `luma-app`: it is the crate under active edit, its own
# per-frame work is thin, and it is the one where a stepping debugger earns its
# keep.
[profile.dev.package.luma-render]
opt-level = 2

[profile.dev.package.luma-scene]
opt-level = 2

# objc2 checks every selector's runtime type signature against the class on
# every `msg_send!` while its own debug assertions are on. The Metal command
# encoder sends thousands of those per frame — one per bind, per draw, per
# pass — and a `sample` of the renderer worker during playback attributed
# 66% of `CommandEncoder::finish` to `msg_send_check` and
# `verify_method_signature`. The check guards against a wrong selector
# signature written in a binding crate, which is not a class of bug this
# tree's dev loop is exercising.
[profile.dev.package.objc2]
debug-assertions = false
