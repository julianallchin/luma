[package]
name = "luma-render"
version = "0.1.0"
edition = "2021"
publish = false

# Offscreen wgpu light-transport renderer (docs/specs/wgpu-renderer.md).
# No windowing, no gpui: the device is ours, and every frame lands in a texture.
# Presentation lives here too: `viewport` and `share` hand finished frames to
# the app, whose `visualizer` puts them on screen.
# The golden renderer has no tests of its own; its output is what the
# `render` test binary checks. No test binary is linked for it.
[[bin]]
name = "render-contract-goldens"
path = "src/bin/render-contract-goldens.rs"
test = false

[dependencies]
luma-scene = { path = "../scene" }
# The build a library fixture's `Definition` carries: its meshes, joints and
# cells, which the frame builder draws. Serde and glam only.
luma-fixture = { path = "../../../backend/crates/luma-fixture" }
glam = "0.30"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["hdr", "jpeg"] }
half = { version = "2", features = ["bytemuck"] }

# Zero-copy presentation (see `share`). The `objc2-*` crates are pinned to the
# majors `wgpu-hal` resolves, because the texture handed to
# `hal::metal::Device::texture_from_raw` must be *that* crate's
# `ProtocolObject<dyn MTLTexture>` and not a structurally identical one from
# another major version.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-video = "0.5.2"
io-surface = "0.16"
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", features = ["objc2"] }

[dev-dependencies]
# `fixture_kinematics_contract` checks beams against the backend crate that
# owns fixture kinematics. It is glam-only by policy, so reaching across into
# the backend workspace is cheap.
fixture-kinematics = { path = "../../../backend/crates/fixture-kinematics" }
# The material presets test reads glTF material names straight from the file.
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
