[package]
name = "luma-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
unicode-segmentation = "1"
luma-patterns = { path = "../../../backend/crates/patterns" }

[features]
# Publishes the automation node tree (`luma_ui::node`) that `gpui-agent` reads.
# Off by default: with the feature disabled `agent_node()` is the identity and
# nothing is registered, so a normal build pays nothing.
agent = []

[target.'cfg(target_os = "linux")'.dev-dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
wgpu = "30"
