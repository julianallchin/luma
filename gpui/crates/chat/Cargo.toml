[package]
name = "luma-chat"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
luma-md = { path = "../md" }
luma-ui = { workspace = true }

# The agent loop. Consumed as a typed Rust stream — see `luma_lib::agent`.
luma_lib = { package = "luma", path = "../../../src-tauri" }

base64 = "0.21"
chrono = "0.4"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[features]
default = []
agent = ["luma-ui/agent"]

