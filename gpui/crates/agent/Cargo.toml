[package]
name = "gpui-agent"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["app"]
# The Luma view tree the MCP binary drives. Off, the crate is a harness with no
# app in it — which is what `cargo test` wants.
app = ["dep:luma-app", "dep:gpui-component"]
# Real text metrics and a real GPU renderer behind the same test platform, so
# frames can be read back as images. Off by default: it links the platform
# crate and creates a GPU device, which a headless `cargo test` must not do.
pixel = [
    "dep:gpui_platform",
    "dep:gpui-component",
    "dep:gpui-component-assets",
    "dep:image",
]

[dependencies]
gpui = { workspace = true, features = ["test-support"] }
luma-ui = { workspace = true, features = ["agent"] }
# MCP's stdio JSON-RPC vocabulary, shared with `luma-mcp` in `src-tauri`.
mcp-stdio = { path = "../../../src-tauri/crates/mcp-stdio" }
rquickjs = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

luma-app = { path = "../app", features = ["agent"], optional = true }

# `test-support` is what exposes `current_headless_renderer`, the whole point
# of pixel mode.
gpui_platform = { workspace = true, optional = true, features = ["test-support"] }
gpui-component = { workspace = true, optional = true }
gpui-component-assets = { workspace = true, optional = true }
# Must track the version gpui itself uses: `render_to_image` hands back that
# crate's `RgbaImage`, and two copies of `image` would not unify.
image = { version = "0.25", optional = true }

[[bin]]
name = "gpui-agent-mcp"
path = "src/bin/mcp.rs"
required-features = ["app"]

# The fixture tests seed a real Luma database before the app opens it: there
# is no command for "a track that was never imported", and the filters under
# test are arithmetic over rows, not over files.
[dev-dependencies]
# `scripted-model` is what lets a test drive a turn without a network.
luma = { path = "../../../src-tauri", features = ["scripted-model"] }
luma-chat = { path = "../chat" }
async-trait = "0.1"
# The sign-in suite writes a Supabase session and its host proof directly:
# the proof is a pair of hashes over exact bytes plus base64url JWT claims, and
# minting one the production way would need Supabase on the other end.
base64 = "0.21"
sha2 = "0.10"
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "time"] }
