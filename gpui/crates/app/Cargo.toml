[package]
name = "luma-app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
luma-ui = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }

# The Luma core, consumed strictly through `luma_lib::dispatch`. Nothing in
# this crate may reach past that seam into a service or a query.
luma_lib = { package = "luma", path = "../../../src-tauri" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
default = []
# Publish the automation node tree so `gpui-agent` can drive these screens.
agent = ["luma-ui/agent"]
